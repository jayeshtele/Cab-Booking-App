<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CabSwift is a responsive React cab booking web app with live fare estimates, trip management, offers, and support."
    />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>CabSwift | Book a Ride</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('cabswift-theme');
          const isDark = savedTheme ? savedTheme === 'dark' : true;
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', isDark ? '#050505' : '#f6f8fb');
        } catch {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
